<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
    
    body { font-family: 'Plus Jakarta Sans', sans-serif; }

    .glass-nav { 
        background: rgba(255, 255, 255, 0.7); 
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
    }

    /* Premium Shimmer for Loading States */
    .skeleton {
        background: #eee;
        background: linear-gradient(110deg, #ececec 8%, #f5f5f5 18%, #ececec 33%);
        border-radius: 5px;
        background-size: 200% 100%;
        animation: 1.5s shine linear infinite;
    }
    @keyframes shine { to { background-position-x: -200%; } }

    /* Fix the Video Player to look Integrated */
    video {
        background: #000;
        outline: none;
        border-radius: 1.8rem;
    }

    /* Custom Scrollbar for the Chat */
    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }

    /* Admin Repost Badge styling */
    .repost-indicator {
        background: rgba(59, 130, 246, 0.1);
        color: #3b82f6;
        padding: 4px 12px;
        border-radius: 10px;
        font-size: 10px;
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 10px;
    }
</style>

<article class="post-card bg-white rounded-[2.5rem] shadow-sm border border-gray-100 overflow-hidden mb-8">
    
    {% if post.is_repost %}
    <div class="px-6 pt-4">
        <div class="repost-indicator uppercase tracking-tighter">
            <i class="fa-solid fa-repeat"></i> Reposté par l'Admin
        </div>
    </div>
    {% endif %}

    <div class="p-5 flex items-center justify-between">
        </div>

    <div class="px-2">
        <div class="rounded-[2rem] overflow-hidden bg-black border border-gray-100 relative group">
            {% if post.is_video %} 
                <video controls preload="metadata" class="w-full max-h-[550px]">
                    <source src="/static/uploads/{{ post.media_file }}" type="video/mp4">
                </video>
            {% elif post.media_file %}
                <img src="/static/uploads/{{ post.media_file }}" 
                     class="w-full max-h-[550px] object-cover group-hover:scale-105 transition-transform duration-700">
            {% endif %}
        </div>
    </div>

    <div class="p-6">
        </div>
</article>
